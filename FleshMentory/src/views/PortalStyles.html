<style>
  :root {
    --ink: #162a35;
    --muted: #64747c;
    --line: #dce5e7;
    --paper: #ffffff;
    --canvas: #f2f6f5;
    --teal: #087e80;
    --teal-dark: #056466;
    --teal-soft: #e4f4f1;
    --gold: #edb960;
    --rose-soft: #fff0e8;
    --shadow: 0 16px 42px rgba(22, 42, 53, .07);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--canvas);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; min-width: 320px; background: var(--canvas); }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .page-shell { max-width: 1160px; margin: 0 auto; padding: 0 28px; }
  .topbar { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .wordmark { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-size: 15px; letter-spacing: -.02em; }
  .wordmark strong { font-weight: 750; }
  .wordmark-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px 10px 10px 3px; background: var(--teal); color: #fff; font-weight: 800; }
  .topbar-label { color: var(--muted); font-size: 13px; }
  .main-content { padding: 20px 0 56px; }
  .intro-panel { min-height: 248px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; padding: 38px 48px; border-radius: 22px; background: #173641; color: white; box-shadow: var(--shadow); }
  .intro-copy { position: relative; z-index: 1; max-width: 660px; }
  .eyebrow { margin: 0 0 13px; color: #a7dcd2; font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
  h1 { max-width: 630px; margin: 0; font-size: clamp(29px, 4.2vw, 43px); line-height: 1.1; letter-spacing: -.045em; }
  .intro-description { max-width: 540px; margin: 16px 0 0; color: #d2e0e2; font-size: 15px; line-height: 1.6; }
  .intro-orbit { position: absolute; right: 35px; top: -90px; width: 330px; height: 330px; border: 1px solid rgba(167, 220, 210, .22); border-radius: 50%; }
  .intro-orbit::before, .intro-orbit::after { content: ""; position: absolute; border: 1px solid rgba(167, 220, 210, .17); border-radius: 50%; }
  .intro-orbit::before { inset: 32px; }
  .intro-orbit::after { inset: 68px; }
  .intro-orbit span { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
  .intro-orbit span:nth-child(1) { top: 56px; left: 66px; }
  .intro-orbit span:nth-child(2) { right: 58px; top: 135px; width: 13px; height: 13px; background: #7ccbc0; }
  .intro-orbit span:nth-child(3) { left: 122px; bottom: 28px; width: 6px; height: 6px; background: #fff; }
  .notice { margin: 22px 0 0; padding: 14px 17px; border: 1px solid #b8dad4; border-radius: 12px; background: var(--teal-soft); color: #155c5d; font-size: 14px; line-height: 1.5; }
  .notice[data-kind="error"] { border-color: #efc3ac; background: var(--rose-soft); color: #8a4220; }
  .portal-content { display: grid; gap: 20px; margin-top: 24px; }
  .loading-card, .empty-card, .section-card { border: 1px solid var(--line); border-radius: 17px; background: var(--paper); box-shadow: 0 7px 24px rgba(22, 42, 53, .035); }
  .loading-card { display: flex; align-items: center; gap: 14px; padding: 26px; color: var(--muted); }
  .loading-card p { margin: 0; }
  .spinner { width: 19px; height: 19px; border: 2px solid #d7e7e5; border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .section-card { padding: 25px 28px 28px; }
  .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
  .section-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
  .section-heading p { max-width: 650px; margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .step-number { flex: 0 0 auto; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--teal-soft); color: var(--teal-dark); font-size: 12px; font-weight: 800; }
  .profile-strip { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 12px; margin-top: 19px; }
  .profile-fact { min-width: 0; padding: 13px 15px; border-radius: 11px; background: #f5f8f7; }
  .profile-fact span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
  .profile-fact strong { display: block; overflow-wrap: anywhere; font-size: 13px; font-weight: 650; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px 20px; }
  .field { min-width: 0; display: grid; gap: 7px; }
  .field.full { grid-column: 1 / -1; }
  .field label, .field-label { color: #344b56; font-size: 12px; font-weight: 700; }
  .field small, .helper { color: var(--muted); font-size: 12px; line-height: 1.5; }
  input[type="text"], input[type="date"], textarea, select { width: 100%; min-height: 43px; padding: 10px 12px; border: 1px solid #cbd8da; border-radius: 9px; outline: none; background: white; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 94px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(8, 126, 128, .12); }
  .topic-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .topic-group { padding: 14px 15px 11px; border-radius: 12px; background: #f5f8f7; }
  .topic-group h3 { margin: 0 0 10px; color: #49616b; font-size: 12px; }
  .check-row { display: flex; align-items: flex-start; gap: 9px; margin: 9px 0; color: #344b56; font-size: 12px; line-height: 1.45; }
  .check-row input { flex: 0 0 auto; width: 15px; height: 15px; margin: 1px 0 0; accent-color: var(--teal); }
  .consent-box { padding: 13px 15px; border: 1px solid #e4eceb; border-radius: 11px; background: #fbfcfc; }
  .button-row { display: flex; align-items: center; gap: 11px; margin-top: 20px; }
  .button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 42px; padding: 0 17px; border: 1px solid transparent; border-radius: 9px; background: var(--teal); color: #fff; font-size: 12px; font-weight: 750; transition: background .15s, transform .15s; }
  .button:hover { background: var(--teal-dark); transform: translateY(-1px); }
  .button:disabled { cursor: wait; opacity: .65; transform: none; }
  .button.secondary { border-color: #cddcdd; background: #fff; color: #31505a; }
  .button.secondary:hover { background: #f3f8f7; }
  .button.quiet { min-height: 35px; padding: 0 12px; border-color: #d6e0e1; background: white; color: #31505a; }
  .list-stack { display: grid; gap: 12px; }
  .item-card { padding: 17px 18px; border: 1px solid #e0e8e8; border-radius: 12px; background: #fcfdfd; }
  .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
  .item-card h3 { margin: 0; font-size: 14px; line-height: 1.4; }
  .item-card p { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; white-space: pre-wrap; }
  .status-pill { flex: 0 0 auto; display: inline-flex; padding: 6px 9px; border-radius: 20px; background: #edf3f2; color: #45616a; font-size: 10px; font-weight: 750; }
  .status-pill.pending { background: #fff4dd; color: #875c10; }
  .inline-note { margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: #fff7e8; color: #735420; font-size: 11px; line-height: 1.5; }
  .invite-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .subsection-title { margin: 22px 0 12px; font-size: 14px; }
  .subsection-title:first-child { margin-top: 0; }
  .progress-form { display: grid; grid-template-columns: minmax(160px, .8fr) minmax(190px, 1fr) auto; gap: 10px; align-items: end; margin-top: 10px; }
  .pulse-form { margin-top: 15px; padding-top: 14px; border-top: 1px solid #e4ebeb; }
  .rating-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .empty-card { padding: 21px 22px; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .empty-card strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 14px; }
  .footer { display: flex; justify-content: space-between; gap: 18px; padding: 0 0 26px; color: #849198; font-size: 11px; }
  .footer span:first-child { color: #61757e; font-weight: 700; }
  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    .page-shell { padding: 0 17px; }
    .topbar { min-height: 66px; }
    .intro-panel { min-height: 220px; padding: 30px 25px; }
    .intro-orbit { right: -170px; opacity: .65; }
    .section-card { padding: 21px 19px; }
    .profile-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .progress-form { grid-template-columns: 1fr; }
    .progress-form .button { width: 100%; }
  }
  @media (max-width: 520px) {
    .topbar-label { font-size: 11px; }
    .wordmark { font-size: 13px; }
    .intro-panel { border-radius: 16px; }
    .form-grid, .topic-groups, .rating-row { grid-template-columns: 1fr; }
    .field.full { grid-column: auto; }
    .profile-strip { gap: 8px; }
    .profile-fact { padding: 11px; }
    .item-top { flex-direction: column; }
    .footer { flex-direction: column; gap: 6px; }
    .button-row { align-items: stretch; flex-direction: column; }
  }
</style>
