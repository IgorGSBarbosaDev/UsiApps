<script>
  (function () {
    'use strict';
    var numberFormat = new Intl.NumberFormat('pt-BR');
    var pageInfo = {
      overview: { title: 'Visão geral', description: 'Indicadores e distribuição da base de programas GT/GP.' },
      people: { title: 'Pessoas', description: 'Busque, filtre e consulte os campos disponíveis por pessoa.' },
      evaluations: { title: 'Avaliações', description: 'Cobertura e distribuição dos valores informados por ciclo.' },
      quality: { title: 'Qualidade dos dados', description: 'Chaves ausentes, duplicadas e campos sem preenchimento.' }
    };
    var defaultColumns = ['nome', 'matricula', 'programavigente', 'enquadre', 'localidade', 'nota20261', 'potencial20261', 'etapa20262'];
    var state = {
      page: 'overview',
      dataset: null,
      loading: true,
      refreshing: false,
      exporting: false,
      error: null,
      search: '',
      program: window.GTGPPeopleView.allFilter,
      location: window.GTGPPeopleView.allFilter,
      columns: [],
      pageNumber: 1,
      pageSize: 25,
      columnMenuOpen: false,
      overviewCeoView: 'vp'
    };

    function escape(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function value(person, key) {
      var raw = person && person.values ? person.values[key] : '';
      return String(raw == null ? '' : raw).trim();
    }
    function groupFor(field) {
      var key = field.key;
      if (/^(nota|potencial|etapa|historicoavaliacoes|ultimociclo|ultimanota|ultimopotencial)/.test(key)) return 'Avaliações';
      if (/^(curso|instituicao|exestagiario|previsaodeformatura)/.test(key)) return 'Formação';
      if (/^(descricaoceo|ceo\d+atual|centrocusto|descricaonivel|nivel2|areafim|vagamapeada|industrialstaff|rotacao|detalhevaga)/.test(key)) return 'Estrutura e trajetória';
      return 'Cadastro';
    }
    function emptyState(title, message) {
      var source = state.dataset && state.dataset.source;
      var fileName = source && source.fileName ? source.fileName : 'Base GTGP.xlsx';
      var note = source ? (source.simulated ? ' · dados simulados' : ' · primeira aba importada') : '';
      return '<section class="empty-state"><span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 3h11l5 5v13H4z"></path><path d="M14 3v6h6M8 14h8m-8 4h8"></path></svg></span><h2>' + escape(title) + '</h2><p>' + escape(message) + '</p><span class="empty-help">Fonte: ' + escape(fileName + note) + '.</span></section>';
    }
    window.GTGPRender = {
      escape: escape,
      number: function (number) { return numberFormat.format(Number(number) || 0); },
      value: value,
      fold: function (text) { return String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR'); },
      emptyState: emptyState
    };

    function sourceLabel() {
      return state.dataset.source.simulated ? 'Demonstração · dados simulados' : 'Base importada';
    }
    function renderFeedback() {
      var region = document.getElementById('feedback-region');
      if (!state.error) { region.innerHTML = ''; return; }
      var error = state.error;
      var code = error.code ? '<span class="alert-code">Código: ' + escape(error.code) + '</span>' : '';
      region.innerHTML = '<section class="alert" role="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6m0-6-6 6"></path></svg><div class="alert-content"><strong class="alert-title">Não foi possível carregar os dados</strong><span class="alert-message">' + escape(error.message || String(error)) + '</span>' + code + '<button class="button button-secondary" type="button" data-action="refresh">Tentar novamente</button></div></section>';
    }
    function restoreFocus(focus) {
      if (!focus || !focus.id) return;
      var target = document.getElementById(focus.id);
      if (!target) return;
      target.focus({ preventScroll: true });
      if (typeof focus.start === 'number' && typeof target.setSelectionRange === 'function') {
        try { target.setSelectionRange(focus.start, focus.end); } catch (ignore) {}
      }
    }
    function render() {
      var active = document.activeElement;
      var focus = active && active.id ? {
        id: active.id,
        start: typeof active.selectionStart === 'number' ? active.selectionStart : null,
        end: typeof active.selectionEnd === 'number' ? active.selectionEnd : null
      } : null;
      var current = pageInfo[state.page] || pageInfo.overview;
      document.querySelectorAll('.nav-link[data-page]').forEach(function (button) {
        var activePage = button.getAttribute('data-page') === state.page;
        button.classList.toggle('is-active', activePage);
        if (activePage) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      document.getElementById('page-title').textContent = current.title;
      document.getElementById('page-description').textContent = current.description;
      document.getElementById('sidebar-source').textContent = state.dataset ? (state.dataset.source.simulated ? 'Dados simulados' : 'Base importada') : 'Carregando fonte…';
      var fileName = state.dataset && state.dataset.source.fileName ? state.dataset.source.fileName : 'Base GTGP.xlsx';
      document.getElementById('sidebar-file').textContent = fileName;
      document.getElementById('footer-source').textContent = fileName;
      var version = state.dataset && state.dataset.source.version ? String(state.dataset.source.version) : '';
      document.getElementById('sidebar-version').textContent = version ? 'Versão ' + version.slice(0, 12) : '';
      document.getElementById('sidebar-version').title = version;
      var badge = document.getElementById('data-badge');
      badge.textContent = state.dataset ? sourceLabel() : (state.loading ? 'Carregando' : 'Sem dados');
      var sync = document.getElementById('sync-status');
      sync.textContent = state.refreshing ? 'Atualizando dados…' : state.dataset ? (state.dataset.source.simulated ? 'Amostra simulada' : 'Dados carregados') : (state.loading ? 'Carregando dados…' : 'Aguardando dados');
      sync.classList.toggle('is-refreshing', state.refreshing);
      document.getElementById('refresh-button').disabled = state.refreshing || state.loading;
      document.getElementById('export-button').disabled = !state.dataset || !state.dataset.people.length || state.exporting;
      document.getElementById('export-button').setAttribute('aria-busy', state.exporting ? 'true' : 'false');
      renderFeedback();
      var root = document.getElementById('view-root');
      if (!state.dataset) {
        root.innerHTML = state.loading
          ? '<div class="loading-state" role="status" aria-label="Carregando dados"><span class="skeleton skeleton-stat"></span><span class="skeleton skeleton-panel"></span></div>'
          : emptyState('Os dados não estão disponíveis', 'Confira a mensagem de erro acima e tente carregar novamente.');
        return;
      }
      if (state.page === 'people') root.innerHTML = window.GTGPPeopleView.render(state.dataset, state);
      else if (state.page === 'evaluations') root.innerHTML = window.GTGPEvaluationsView.render(state.dataset);
      else if (state.page === 'quality') root.innerHTML = window.GTGPQualityView.render(state.dataset);
      else root.innerHTML = window.GTGPOverviewView.render(state.dataset, state.overviewCeoView);
      restoreFocus(focus);
    }
    function showToast(message, isError) {
      var region = document.getElementById('toast-region');
      var toast = document.createElement('div');
      toast.className = 'toast' + (isError ? ' is-error' : '');
      toast.textContent = message;
      region.appendChild(toast);
      window.setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 4200);
    }
    function validateData(data) {
      if (!data || !data.source || !Array.isArray(data.fields) || !Array.isArray(data.people) || !data.quality) {
        var error = new Error('A resposta data precisa conter source, fields, people e quality conforme docs/DATA_CONTRACT.md.');
        error.code = 'INVALID_DASHBOARD_DATA';
        throw error;
      }
      if (typeof data.source.fileName !== 'string' || typeof data.source.sheetName !== 'string' || typeof data.source.simulated !== 'boolean') {
        var sourceError = new Error('source precisa informar fileName, sheetName e simulated conforme docs/DATA_CONTRACT.md.');
        sourceError.code = 'INVALID_DASHBOARD_SOURCE';
        throw sourceError;
      }
      var invalidField = data.fields.some(function (field) {
        return !field || typeof field.key !== 'string' || typeof field.label !== 'string' || !Array.isArray(field.source);
      });
      if (invalidField) {
        var fieldError = new Error('Cada item de fields precisa informar key, label e source conforme docs/DATA_CONTRACT.md.');
        fieldError.code = 'INVALID_DASHBOARD_FIELDS';
        throw fieldError;
      }
      var invalidPerson = data.people.some(function (person) {
        return !person || typeof person.id !== 'string' || typeof person.matricula !== 'string'
          || !person.values || typeof person.values !== 'object' || Array.isArray(person.values) || !Array.isArray(person.sources);
      });
      if (invalidPerson) {
        var peopleError = new Error('Cada item de people precisa informar id, matricula, values e sources conforme docs/DATA_CONTRACT.md.');
        peopleError.code = 'INVALID_DASHBOARD_PEOPLE';
        throw peopleError;
      }
      var qualityKeys = ['rowCount', 'duplicateIds', 'missingIds', 'blankNames'];
      var invalidQuality = qualityKeys.some(function (key) {
        return typeof data.quality[key] !== 'number' || !Number.isFinite(data.quality[key]);
      });
      if (invalidQuality) {
        var qualityError = new Error('quality precisa fornecer as quatro contagens definidas em docs/DATA_CONTRACT.md.');
        qualityError.code = 'INVALID_DASHBOARD_QUALITY';
        throw qualityError;
      }
      return data;
    }
    function load(initial) {
      if (initial) state.loading = true;
      else state.refreshing = true;
      state.error = null;
      render();
      return window.GTGPDashboardClient.getDashboardData()
        .then(function (response) {
          state.dataset = validateData(response.data);
          var keys = new Set(state.dataset.fields.map(function (field) { return field.key; }));
          state.columns = state.columns.filter(function (key) { return keys.has(key); });
          if (!state.columns.length) {
            state.columns = defaultColumns.filter(function (key) { return keys.has(key); });
            if (!state.columns.length) state.columns = state.dataset.fields.slice(0, 8).map(function (field) { return field.key; });
          }
          state.error = null;
          if (!initial) showToast(state.dataset.source.simulated ? 'A amostra simulada foi atualizada.' : 'Os dados foram atualizados.');
        })
        .catch(function (error) {
          state.error = error instanceof Error ? error : new Error(String(error));
        })
        .finally(function () {
          state.loading = false;
          state.refreshing = false;
          render();
        });
    }
    function filteredPeople() { return window.GTGPPeopleView.filteredPeople(state.dataset, state); }
    function exportPayload() {
      var visiblePeople = state.page === 'people' ? filteredPeople() : state.dataset.people;
      var visibleFields = state.page === 'people'
        ? state.dataset.fields.filter(function (field) { return state.columns.indexOf(field.key) !== -1; })
        : state.dataset.fields;
      return { ids: visiblePeople.map(function (person) { return person.id; }), fields: visibleFields.map(function (field) { return field.key; }) };
    }
    function exportXlsx() {
      if (!state.dataset || state.exporting) return;
      var payload = exportPayload();
      if (!payload.ids.length || !payload.fields.length) {
        showToast('Não há pessoas e campos visíveis para exportar.', true);
        return;
      }
      state.exporting = true;
      render();
      window.GTGPExportClient.exportXlsx(state.dataset, payload)
        .then(function () {
          showToast(numberFormat.format(payload.ids.length) + ' pessoas e ' + numberFormat.format(payload.fields.length) + ' campos foram exportados.');
        })
        .catch(function (error) {
          showToast((error.code ? error.code + ': ' : '') + (error.message || String(error)), true);
        })
        .finally(function () { state.exporting = false; render(); });
    }
    function openProfile(personId) {
      if (!state.dataset) return;
      var person = state.dataset.people.find(function (item) { return item.id === personId; });
      if (!person) return;
      var fields = state.dataset.fields || [];
      var groups = ['Cadastro', 'Estrutura e trajetória', 'Formação', 'Avaliações'].map(function (name) {
        return { name: name, fields: fields.filter(function (field) { return groupFor(field) === name; }) };
      }).filter(function (group) { return group.fields.length; });
      var name = value(person, 'nome') || 'Pessoa sem nome';
      var matricula = person.matricula || value(person, 'matricula') || '';
      var quickfacts = '<span>' + escape(value(person, 'programavigente') || 'Programa não informado') + '</span><span>' + escape(value(person, 'localidade') || 'Localidade não informada') + '</span>';
      var groupsHtml = groups.map(function (group) {
        var cells = group.fields.map(function (field) {
          var fieldValue = value(person, field.key);
          if (field.key === 'matricula' && !fieldValue) fieldValue = matricula;
          var sourceText = 'Aba ' + (field.source[0] || 'não informada');
          var wide = /^(historicoavaliacoes|observacao|comentarios|detalhevaga)$/.test(field.key) ? ' is-wide' : '';
          return '<div class="detail-field' + wide + '"><dt>' + escape(field.label) + '</dt><dd class="' + (fieldValue ? '' : 'is-missing') + '">' + escape(fieldValue || 'Sem preenchimento') + '</dd><span class="detail-source">' + escape(sourceText) + '</span></div>';
        }).join('');
        return '<section class="detail-group"><h3>' + escape(group.name) + '</h3><dl class="detail-grid">' + cells + '</dl></section>';
      }).join('');
      document.getElementById('profile-content').innerHTML =
        '<div class="profile-shell"><header class="profile-header"><span class="profile-badge">Perfil completo</span><button class="icon-button profile-close" type="button" data-action="close-profile" aria-label="Fechar perfil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>' +
        '<h2 id="profile-title">' + escape(name) + '</h2><p class="profile-subtitle">' + (matricula ? 'Matrícula ' + escape(matricula) : 'Matrícula não preenchida') + ' · dados disponíveis na primeira aba</p><div class="profile-quickfacts">' + quickfacts + '</div></header>' +
        '<div class="profile-scroll">' + groupsHtml + '</div><footer class="profile-footer"><span>' + numberFormat.format(fields.length) + ' campos disponíveis</span><span>Atualize o XLSX de origem e importe a nova versão.</span></footer></div>';
      var dialog = document.getElementById('profile-dialog');
      if (!dialog.open) dialog.showModal();
    }
    document.addEventListener('click', function (event) {
      var actionTarget = event.target.closest('[data-action]');
      if (actionTarget) {
        var action = actionTarget.getAttribute('data-action');
        if (action === 'toggle-nav') {
          var shell = document.getElementById('app-shell');
          if (window.matchMedia('(max-width: 820px)').matches) {
            var opened = shell.classList.toggle('is-mobile-nav-open');
            actionTarget.setAttribute('aria-expanded', opened ? 'true' : 'false');
            actionTarget.setAttribute('aria-label', opened ? 'Fechar navegação' : 'Abrir navegação');
          } else {
            shell.classList.toggle('is-collapsed');
            actionTarget.setAttribute('aria-expanded', shell.classList.contains('is-collapsed') ? 'false' : 'true');
          }
        } else if (action === 'refresh') {
          if (!state.refreshing && !state.loading) load(false);
        } else if (action === 'export') {
          exportXlsx();
        } else if (action === 'navigate') {
          state.page = actionTarget.getAttribute('data-page-target') || 'overview';
          state.pageNumber = 1;
          document.getElementById('app-shell').classList.remove('is-mobile-nav-open');
          document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
          render();
        } else if (action === 'previous-page') {
          state.pageNumber = Math.max(1, state.pageNumber - 1);
          render();
        } else if (action === 'next-page') {
          state.pageNumber += 1;
          render();
        } else if (action === 'open-profile') {
          openProfile(actionTarget.getAttribute('data-person-id'));
        } else if (action === 'close-profile') {
          document.getElementById('profile-dialog').close();
        }
        return;
      }
      var nav = event.target.closest('.nav-link[data-page]');
      if (nav) {
        state.page = nav.getAttribute('data-page');
        state.pageNumber = 1;
        document.getElementById('app-shell').classList.remove('is-mobile-nav-open');
        document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
        document.getElementById('menu-toggle').setAttribute('aria-label', 'Abrir navegação');
        render();
        return;
      }
      if (event.target === document.getElementById('app-shell') && document.getElementById('app-shell').classList.contains('is-mobile-nav-open')) {
        document.getElementById('app-shell').classList.remove('is-mobile-nav-open');
        document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
        document.getElementById('menu-toggle').setAttribute('aria-label', 'Abrir navegação');
      }
    });
    document.addEventListener('input', function (event) {
      if (event.target && event.target.id === 'people-search') {
        state.search = event.target.value;
        state.pageNumber = 1;
        render();
      }
    });
    document.addEventListener('change', function (event) {
      if (!event.target) return;
      if (event.target.id === 'overview-ceo-filter') {
        state.overviewCeoView = event.target.value;
        render();
      } else if (event.target.id === 'program-filter') {
        state.program = event.target.value;
        state.pageNumber = 1;
        render();
      } else if (event.target.id === 'location-filter') {
        state.location = event.target.value;
        state.pageNumber = 1;
        render();
      } else if (event.target.matches('input[data-action="toggle-column"]')) {
        var key = event.target.value;
        var checked = event.target.checked;
        state.columnMenuOpen = true;
        if (checked && state.columns.indexOf(key) === -1) state.columns.push(key);
        if (!checked && state.columns.length === 1) showToast('Mantenha pelo menos um campo visível.', true);
        else if (!checked) state.columns = state.columns.filter(function (item) { return item !== key; });
        render();
      }
    });
    document.getElementById('view-root').addEventListener('toggle', function (event) {
      if (event.target && event.target.matches('.column-picker')) state.columnMenuOpen = event.target.open;
    }, true);
    document.getElementById('profile-dialog').addEventListener('click', function (event) {
      if (event.target === this) this.close();
    });
    window.GTGPAppController = { getState: function () { return state; }, refresh: function () { return load(false); } };
    render();
    load(true);
  })();
</script>
