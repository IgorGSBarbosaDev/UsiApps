<style>
  :root {
    color-scheme: light;
    --deep-green: #123d2a;
    --deep-green-hover: #1b5036;
    --lime: #84bd00;
    --canvas: #f5f7f3;
    --surface: #fff;
    --foreground: #19251c;
    --muted: #536055;
    --border: #d9e0d6;
    --soft-border: #d9e0d6;
    --danger: #b42318;
    --warning: #87500b;
    --chart-green: #537d3b;
    --chart-sage: #9bb583;
    --chart-ochre: #d1a12b;
    --radius: 12px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
  }

  * { box-sizing: border-box; }
  html { min-width: 320px; background: var(--canvas); }
  body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--foreground); background: var(--canvas); font-size: 13px; }
  button, input, select { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible {
    outline: 3px solid #84bd00;
    outline-offset: 2px;
  }
  button:disabled { cursor: not-allowed; opacity: .55; }
  .app-shell { --sidebar-width: 248px; min-height: 100vh; }
  .sidebar {
    position: fixed; z-index: 30; inset: 0 auto 0 0; display: flex; width: var(--sidebar-width); flex-direction: column;
    padding: 21px 15px 15px; color: #f5f7f3; background: var(--deep-green); transition: transform .18s ease;
  }
  .brand-lockup { display: flex; align-items: center; gap: 11px; min-height: 43px; padding: 0 8px 17px; }
  .brand-mark { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; border-radius: 8px; color: #19251c; background: var(--lime); font-weight: 800; font-size: 17px; }
  .brand-copy { display: grid; gap: 1px; }
  .brand-copy strong { color: #fff; font-size: 14px; letter-spacing: .015em; }
  .brand-copy small { color: #ffffff; font-size: 11px; }
  .nav-caption { margin: 21px 9px 8px; color: #ffffff; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .primary-nav { display: grid; gap: 5px; }
  .nav-link {
    display: flex; min-height: 41px; align-items: center; gap: 11px; padding: 0 11px; border: 0; border-radius: 8px;
    color: #ffffff; background: transparent; text-align: left; cursor: pointer; font-size: 12px;
  }
  .nav-link svg, .button svg, .icon-button svg { width: 17px; height: 17px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .nav-link:hover { color: #fff; background: #123d2a; }
  .nav-link.is-active, .nav-link[aria-current="page"] { color: #19251c; background: var(--lime); font-weight: 650; }
  .nav-link.is-active:hover { background: #84bd00; }
  .nav-link span { min-width: 0; }
  .sidebar-bottom { margin-top: auto; padding: 14px 9px 4px; border-top: 1px solid #123d2a; }
  .source-label { display: flex; align-items: center; gap: 8px; color: #ffffff; font-size: 11px; }
  .status-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--lime); }
  .source-file { margin: 10px 0 0; color: #fff; font-size: 12px; font-weight: 620; }
  .source-version { margin: 4px 0 0 15px; overflow-wrap: anywhere; color: #ffffff; font-size: 10px; }
  .workspace { min-height: 100vh; margin-left: var(--sidebar-width);  }
  .app-shell.is-collapsed { --sidebar-width: 72px; }
  .app-shell.is-collapsed .sidebar { align-items: center; padding-right: 8px; padding-left: 8px; }
  .app-shell.is-collapsed .brand-lockup { padding-right: 0; padding-left: 0; }
  .app-shell.is-collapsed .brand-copy, .app-shell.is-collapsed .nav-caption, .app-shell.is-collapsed .nav-link span, .app-shell.is-collapsed .sidebar-bottom { display: none; }
  .app-shell.is-collapsed .primary-nav { width: 100%; }
  .app-shell.is-collapsed .nav-link { justify-content: center; padding: 0; }
  .topbar {
    position: sticky; z-index: 20; top: 0; display: flex; min-height: 64px; align-items: center; justify-content: space-between;
    gap: 16px; padding: 0 34px; border-bottom: 1px solid #d9e0d6; background: rgba(255,255,255,.97);
  }
  .topbar-leading, .topbar-actions { display: flex; min-width: 0; align-items: center; gap: 12px; }
  .topbar-context { color: #536055; font-size: 13px; font-weight: 620; white-space: nowrap; }
  .topbar-divider { width: 1px; height: 21px; background: var(--border); }
  .sync-status { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .sync-status.is-refreshing::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--lime); animation: pulse 1s ease-in-out infinite; }
  .icon-button, .button {
    display: inline-flex; min-height: 36px; align-items: center; justify-content: center; gap: 8px; padding: 0 11px;
    border: 1px solid transparent; border-radius: 7px; cursor: pointer; text-decoration: none; font-size: 12px; font-weight: 570;
  }
  .icon-button { width: 36px; padding: 0; background: transparent; }
  .icon-button:hover { background: #edf2ea; }
  .button-secondary { border-color: #d9e0d6; color: #536055; background: #fff; }
  .button-secondary:hover:not(:disabled) { background: #f5f7f3; }
  .button-primary { color: #fff; background: var(--deep-green); }
  .button-primary:hover:not(:disabled) { background: var(--deep-green-hover); }
  .main-content { width: min(100%, 1640px); margin: 0 auto; padding: 30px 34px 18px; }
  .feedback-region:empty { display: none; }
  .feedback-region { margin-bottom: 18px; }
  .alert { display: flex; align-items: flex-start; gap: 11px; padding: 13px 15px; border: 1px solid #d9e0d6; border-radius: 8px; color: #70251d; background: #f5f7f3; }
  .alert svg { width: 17px; height: 17px; flex: 0 0 auto; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .alert-content { display: grid; gap: 4px; min-width: 0; }
  .alert-title { font-size: 12px; font-weight: 680; }
  .alert-message { overflow-wrap: anywhere; color: #71342e; font-size: 12px; line-height: 1.5; }
  .alert-code { color: #7f5049; font-size: 10px; }
  .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 0 0 24px; }
  .page-heading h1 { margin: 0; color: #18251c; font-size: 26px; font-weight: 670; letter-spacing: -.025em; line-height: 1.2; }
  .page-heading p { max-width: 72ch; margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .data-badge { display: inline-flex; min-height: 25px; align-items: center; border: 1px solid #c7d9a9; border-radius: 6px; padding: 0 9px; color: #325220; background: #edf5df; font-size: 11px; white-space: nowrap; }
  .page-stack { display: grid; gap: 20px; }
  .stats-band { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .stat-item { display: grid; min-width: 0; align-content: center; gap: 5px; padding: 17px 20px 18px; }
  .stat-item + .stat-item { border-left: 1px solid var(--soft-border); }
  .stat-label { color: var(--muted); font-size: 11px; font-weight: 570; }
  .stat-value { color: #173d29; font-size: 22px; font-weight: 680; font-variant-numeric: tabular-nums; letter-spacing: -.025em; line-height: 1.2; overflow-wrap: anywhere; }
  .stat-note { color: #536055; font-size: 11px; line-height: 1.4; }
  .stat-item.is-attention .stat-value { color: var(--warning); }
  .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .panel { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 19px 20px 12px; }
  .panel-title { margin: 0; color: #19251c; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .panel-description { margin: 4px 0 0; color: #536055; font-size: 11px; line-height: 1.5; }
  .panel-content { padding: 5px 17px 16px; }
  .panel-action { flex: 0 0 auto; }
  .chart-svg { display: block; width: 100%; overflow: visible; }
  .chart-svg text { fill: #536055; font-family: inherit; font-size: 11px; }
  .chart-svg .bar-count { fill: #123d2a; font-size: 11px; font-weight: 650; }
  .chart-svg .bar-track { fill: #f5f7f3; }
  .empty-chart { display: grid; min-height: 185px; place-content: center; gap: 8px; color: #536055; text-align: center; font-size: 12px; }
  .panel-heading-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .table-wrap { width: 100%; overflow-x: auto; }
  .data-table { width: 100%; min-width: 680px; border-collapse: collapse; text-align: left; }
  .data-table th { height: 37px; padding: 8px 13px; color: #536055; background: #f5f7f3; font-size: 10px; font-weight: 630; white-space: nowrap; }
  .data-table td { max-width: 280px; height: 43px; overflow: hidden; padding: 8px 13px; border-top: 1px solid #d9e0d6; color: #536055; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .data-table tbody tr:hover { background: #f5f7f3; }
  .person-link { max-width: 250px; overflow: hidden; padding: 0; border: 0; color: #174d30; background: transparent; cursor: pointer; font-size: 11px; font-weight: 640; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
  .person-link:hover { color: #255d35; text-decoration: underline; text-underline-offset: 3px; }
  .muted-value { color: #536055; }
  .empty-row { padding: 25px 15px !important; color: #536055 !important; text-align: center; white-space: normal !important; }
  .filter-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .search-field { position: relative; display: flex; min-width: 240px; flex: 1 1 290px; align-items: center; }
  .search-field svg { position: absolute; left: 11px; width: 16px; height: 16px; fill: none; stroke: #536055; stroke-width: 1.8; pointer-events: none; }
  .search-field input { width: 100%; min-height: 38px; padding: 0 12px 0 35px; border: 1px solid #d9e0d6; border-radius: 7px; color: var(--foreground); background: #fff; font-size: 12px; }
  .filter-select { min-width: 170px; min-height: 38px; padding: 0 10px; border: 1px solid #d9e0d6; border-radius: 7px; color: #536055; background: #fff; font-size: 12px; }
  .column-picker { position: relative; }
  .column-picker summary { display: flex; min-height: 38px; align-items: center; gap: 9px; padding: 0 11px; border: 1px solid #d9e0d6; border-radius: 7px; color: #536055; background: #fff; cursor: pointer; font-size: 12px; font-weight: 570; list-style: none; }
  .column-picker summary::-webkit-details-marker { display: none; }
  .column-picker summary::after { width: 6px; height: 6px; margin: -3px 1px 0 auto; border-right: 1.5px solid #536055; border-bottom: 1.5px solid #536055; content: ""; transform: rotate(45deg); }
  .column-count { display: inline-grid; min-width: 21px; height: 19px; place-items: center; border-radius: 5px; color: #26452d; background: #edf5df; font-size: 10px; }
  .column-menu { position: absolute; z-index: 15; top: calc(100% + 5px); right: 0; width: min(280px, 88vw); max-height: 330px; overflow: auto; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; box-shadow: 0 8px 24px color-mix(in srgb, #123d2a 13%, transparent); }
  .column-menu-title { margin: 4px 7px 7px; color: #46584c; font-size: 11px; font-weight: 650; }
  .column-option { display: flex; min-height: 34px; align-items: center; gap: 9px; padding: 5px 7px; border-radius: 5px; color: #536055; cursor: pointer; font-size: 11px; }
  .column-option:hover { background: #f5f7f3; }
  .column-option input { width: 15px; height: 15px; accent-color: var(--deep-green); }
  .table-summary, .pagination-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; color: var(--muted); font-size: 11px; }
  .table-summary { border-bottom: 1px solid var(--soft-border); }
  .table-summary strong { color: #123d2a; font-size: 13px; }
  .pagination-row { border-top: 1px solid var(--soft-border); }
  .pagination-controls { display: flex; align-items: center; gap: 9px; }
  .pagination-controls .button { min-height: 32px; font-size: 11px; }
  .page-count { min-width: 45px; color: #536055; font-variant-numeric: tabular-nums; text-align: center; }
  .cycle-band { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
  .cycle-block { display: grid; align-content: start; gap: 7px; padding: 20px 23px; }
  .cycle-block + .cycle-block { border-left: 1px solid var(--soft-border); }
  .cycle-name { color: var(--muted); font-size: 11px; font-weight: 610; }
  .cycle-value { color: #173d29; font-size: 24px; font-weight: 680; letter-spacing: -.025em; }
  .cycle-value small { color: var(--muted); font-size: 12px; font-weight: 520; letter-spacing: 0; }
  .cycle-note { color: #536055; font-size: 11px; line-height: 1.45; }
  .subtle-alert { border-color: #d9e0d6; color: #344835; background: #f1f6e9; }
  .subtle-alert .alert-message { color: #536055; }
  .chart-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 9px 16px; padding: 4px 8px 8px; }
  .legend-item { display: grid; min-width: 0; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 8px; color: #536055; font-size: 11px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  .legend-item strong { color: #203b2b; font-size: 11px; font-variant-numeric: tabular-nums; }
  .quality-summary { display: flex; min-height: 78px; align-items: center; gap: 13px; padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
  .quality-summary.is-attention { border-color: #d9e0d6; background: #ffffff; }
  .quality-summary svg { width: 19px; height: 19px; flex: 0 0 auto; fill: none; stroke: #123d2a; stroke-width: 1.8; }
  .quality-summary.is-attention svg { stroke: #b42318; }
  .quality-summary-copy { display: grid; flex: 1; gap: 3px; }
  .quality-summary-copy strong { color: #19251c; font-size: 13px; }
  .quality-summary-copy span { color: #536055; font-size: 11px; }
  .status-badge { min-height: 23px; padding: 3px 8px; border: 1px solid #d6ddd3; border-radius: 6px; color: #536055; background: #f7f9f6; font-size: 10px; white-space: nowrap; }
  .status-badge.is-problem { border-color: #e9d1a8; color: #b42318; background: #fffbf2; }
  .quality-list { display: grid; padding: 0 20px 8px; }
  .quality-row { display: grid; min-height: 69px; grid-template-columns: 25px minmax(180px, 1fr) 48px 90px; align-items: center; gap: 12px; border-top: 1px solid #d9e0d6; }
  .quality-icon { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 50%; }
  .quality-icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .quality-ok { color: #123d2a; background: #f5f7f3; }
  .quality-error { color: #b42318; background: #f5f7f3; }
  .quality-warning { color: #b42318; background: #f5f7f3; }
  .quality-info { color: #536055; background: #f5f7f3; }
  .quality-copy { display: grid; gap: 3px; }
  .quality-copy strong { color: #19251c; font-size: 12px; font-weight: 620; }
  .quality-copy span { color: #536055; font-size: 10px; line-height: 1.45; }
  .quality-count { color: #233b2a; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
  .quality-status { min-width: 72px; justify-self: end; padding: 4px 7px; border: 1px solid #d6ddd3; border-radius: 6px; color: #536055; background: #f7f9f6; font-size: 10px; text-align: center; }
  .quality-status.is-review { border-color: #d9e0d6; color: #b42318; background: #f5f7f3; }
  .quality-status.is-warning { border-color: #e9d1a8; color: #b42318; background: #fffbf2; }
  .quality-status.is-info { border-color: #d6ddd3; color: #536055; background: #f7f9f6; }
  .join-note { display: flex; max-width: 76ch; align-items: flex-start; gap: 10px; color: #536055; }
  .join-note svg { width: 17px; height: 17px; flex: 0 0 auto; margin-top: 2px; fill: none; stroke: #3d6545; stroke-width: 1.8; }
  .join-note p { margin: 0; font-size: 11px; line-height: 1.6; }
  .empty-state { display: grid; min-height: 300px; align-content: center; justify-items: center; gap: 12px; padding: 32px 24px; border: 1px dashed #d9e0d6; border-radius: 12px; background: #fff; text-align: center; }
  .empty-icon { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 12px; color: #123d2a; background: #f5f7f3; }
  .empty-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .empty-state h2 { margin: 0; color: #19251c; font-size: 17px; font-weight: 650; }
  .empty-state p { max-width: 64ch; margin: 0; color: #536055; font-size: 12px; line-height: 1.6; }
  .empty-help { color: #536055; font-size: 10px; }
  .loading-state { display: grid; gap: 20px; }
  .skeleton { display: block; border: 1px solid var(--border); border-radius: 12px; background: linear-gradient(90deg, #edf1ea 25%, #f5f7f3 42%, #edf1ea 65%); background-size: 300% 100%; animation: shimmer 1.3s ease-in-out infinite; }
  .skeleton-stat { height: 94px; }
  .skeleton-panel { height: 310px; }
  .profile-dialog { position: fixed; inset: 0 0 0 auto; width: min(96vw, 760px); max-width: none; height: 100dvh; max-height: none; margin: 0; padding: 0; overflow: hidden; border: 0; background: #fff; color: var(--foreground); box-shadow: -18px 0 50px color-mix(in srgb, #123d2a 17%, transparent); }
  .profile-dialog::backdrop { background: color-mix(in srgb, #19251c 58%, transparent); }
  .profile-shell { display: flex; height: 100%; flex-direction: column; }
  .profile-header { position: relative; padding: 24px 27px 18px; border-bottom: 1px solid #d9e0d6; }
  .profile-header h2 { margin: 13px 38px 5px 0; color: #173d29; font-size: 22px; font-weight: 680; letter-spacing: -.02em; }
  .profile-subtitle { margin: 0; color: #536055; font-size: 11px; }
  .profile-badge { display: inline-flex; align-items: center; min-height: 23px; padding: 0 8px; border: 1px solid #c7d9a9; border-radius: 6px; color: #325220; background: #edf5df; font-size: 10px; }
  .profile-quickfacts { display: flex; flex-wrap: wrap; gap: 9px 18px; margin-top: 12px; color: #536055; font-size: 11px; }
  .profile-close { position: absolute; top: 19px; right: 20px; }
  .profile-scroll { min-height: 0; flex: 1; overflow: auto; padding: 3px 27px 22px; }
  .detail-group { padding-top: 20px; }
  .detail-group h3 { margin: 0 0 11px; color: #123d2a; font-size: 12px; font-weight: 670; }
  .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; overflow: hidden; margin: 0; border: 1px solid #d9e0d6; border-radius: 8px; background: #d9e0d6; }
  .detail-field { display: grid; min-width: 0; align-content: start; gap: 5px; padding: 11px 12px; background: #fff; }
  .detail-field.is-wide { grid-column: 1 / -1; }
  .detail-field dt { color: #536055; font-size: 10px; font-weight: 570; }
  .detail-field dd { overflow-wrap: anywhere; margin: 0; color: #19251c; font-size: 11px; line-height: 1.5; white-space: pre-wrap; }
  .detail-field dd.is-missing { color: #536055; font-style: italic; }
  .detail-source { color: #536055; font-size: 9px; }
  .profile-footer { display: flex; justify-content: space-between; gap: 12px; padding: 12px 27px; border-top: 1px solid #d9e0d6; color: #536055; background: #f5f7f3; font-size: 10px; }
  .page-footnote { margin: 22px 0 3px; color: #536055; font-size: 10px; }
  .toast-region { position: fixed; z-index: 80; right: 22px; bottom: 18px; display: grid; gap: 8px; pointer-events: none; }
  .toast { max-width: min(420px, calc(100vw - 28px)); padding: 12px 15px; border: 1px solid #d9e0d6; border-radius: 8px; color: #123d2a; background: #f1f8f1; box-shadow: 0 7px 20px color-mix(in srgb, #123d2a 12%, transparent); font-size: 12px; }
  .toast.is-error { border-color: #d9e0d6; color: #b42318; background: #f5f7f3; }
  .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; clip-path: inset(50%) !important; }
  @keyframes shimmer { to { background-position: -150% 0; } }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (max-width: 1120px) {
    .topbar, .main-content { padding-right: 24px; padding-left: 24px; }
    .stats-band { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat-item:nth-child(3) { border-top: 1px solid var(--soft-border); border-left: 0; }
    .stat-item:nth-child(4) { border-top: 1px solid var(--soft-border); }
  }
  @media (max-width: 820px) {
    .app-shell { --sidebar-width: 0px; }
    .sidebar { width: 248px; transform: translateX(-100%); transition: transform .2s ease; }
    .app-shell.is-mobile-nav-open .sidebar { transform: translateX(0); }
    .app-shell.is-mobile-nav-open::after { position: fixed; z-index: 25; inset: 0; content: ""; background: rgba(14,29,19,.38); }
    .app-shell.is-collapsed { --sidebar-width: 0px; }
