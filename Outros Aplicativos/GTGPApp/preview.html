<!doctype html>
<html lang="pt-BR">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123d2a">
    <title>GT/GP · Painel de gestão</title>
    <style>
  :root {
    color-scheme: light;
    --deep-green: #123d2a;
    --deep-green-hover: #1b5036;
    --lime: #84bd00;
    --canvas: #f5f7f3;
    --surface: #fff;
    --foreground: #19251c;
    --muted: #536055;
    --border: #d9e0d6;
    --soft-border: #d9e0d6;
    --danger: #b42318;
    --warning: #87500b;
    --chart-green: #537d3b;
    --chart-sage: #9bb583;
    --chart-ochre: #d1a12b;
    --radius: 12px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
  }

  * { box-sizing: border-box; }
  html { min-width: 320px; background: var(--canvas); }
  body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--foreground); background: var(--canvas); font-size: 13px; }
  button, input, select { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible {
    outline: 3px solid #84bd00;
    outline-offset: 2px;
  }
  button:disabled { cursor: not-allowed; opacity: .55; }
  .app-shell { --sidebar-width: 248px; min-height: 100vh; }
  .sidebar {
    position: fixed; z-index: 30; inset: 0 auto 0 0; display: flex; width: var(--sidebar-width); flex-direction: column;
    padding: 21px 15px 15px; color: #f5f7f3; background: var(--deep-green); transition: transform .18s ease;
  }
  .brand-lockup { display: flex; align-items: center; gap: 11px; min-height: 43px; padding: 0 8px 17px; }
  .brand-mark { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; border-radius: 8px; color: #19251c; background: var(--lime); font-weight: 800; font-size: 17px; }
  .brand-copy { display: grid; gap: 1px; }
  .brand-copy strong { color: #fff; font-size: 14px; letter-spacing: .015em; }
  .brand-copy small { color: #ffffff; font-size: 11px; }
  .nav-caption { margin: 21px 9px 8px; color: #ffffff; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .primary-nav { display: grid; gap: 5px; }
  .nav-link {
    display: flex; min-height: 41px; align-items: center; gap: 11px; padding: 0 11px; border: 0; border-radius: 8px;
    color: #ffffff; background: transparent; text-align: left; cursor: pointer; font-size: 12px;
  }
  .nav-link svg, .button svg, .icon-button svg { width: 17px; height: 17px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .nav-link:hover { color: #fff; background: #123d2a; }
  .nav-link.is-active, .nav-link[aria-current="page"] { color: #19251c; background: var(--lime); font-weight: 650; }
  .nav-link.is-active:hover { background: #84bd00; }
  .nav-link span { min-width: 0; }
  .sidebar-bottom { margin-top: auto; padding: 14px 9px 4px; border-top: 1px solid #123d2a; }
  .source-label { display: flex; align-items: center; gap: 8px; color: #ffffff; font-size: 11px; }
  .status-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--lime); }
  .source-file { margin: 10px 0 0; color: #fff; font-size: 12px; font-weight: 620; }
  .source-version { margin: 4px 0 0 15px; overflow-wrap: anywhere; color: #ffffff; font-size: 10px; }
  .workspace { min-height: 100vh; margin-left: var(--sidebar-width);  }
  .app-shell.is-collapsed { --sidebar-width: 72px; }
  .app-shell.is-collapsed .sidebar { align-items: center; padding-right: 8px; padding-left: 8px; }
  .app-shell.is-collapsed .brand-lockup { padding-right: 0; padding-left: 0; }
  .app-shell.is-collapsed .brand-copy, .app-shell.is-collapsed .nav-caption, .app-shell.is-collapsed .nav-link span, .app-shell.is-collapsed .sidebar-bottom { display: none; }
  .app-shell.is-collapsed .primary-nav { width: 100%; }
  .app-shell.is-collapsed .nav-link { justify-content: center; padding: 0; }
  .topbar {
    position: sticky; z-index: 20; top: 0; display: flex; min-height: 64px; align-items: center; justify-content: space-between;
    gap: 16px; padding: 0 34px; border-bottom: 1px solid #d9e0d6; background: rgba(255,255,255,.97);
  }
  .topbar-leading, .topbar-actions { display: flex; min-width: 0; align-items: center; gap: 12px; }
  .topbar-context { color: #536055; font-size: 13px; font-weight: 620; white-space: nowrap; }
  .topbar-divider { width: 1px; height: 21px; background: var(--border); }
  .sync-status { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .sync-status.is-refreshing::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--lime); animation: pulse 1s ease-in-out infinite; }
  .icon-button, .button {
    display: inline-flex; min-height: 36px; align-items: center; justify-content: center; gap: 8px; padding: 0 11px;
    border: 1px solid transparent; border-radius: 7px; cursor: pointer; text-decoration: none; font-size: 12px; font-weight: 570;
  }
  .icon-button { width: 36px; padding: 0; background: transparent; }
  .icon-button:hover { background: #edf2ea; }
  .button-secondary { border-color: #d9e0d6; color: #536055; background: #fff; }
  .button-secondary:hover:not(:disabled) { background: #f5f7f3; }
  .button-primary { color: #fff; background: var(--deep-green); }

  .main-content { width: min(100%, 1640px); margin: 0 auto; padding: 30px 34px 18px; }
  .feedback-region:empty { display: none; }
  .feedback-region { margin-bottom: 18px; }
  .alert { display: flex; align-items: flex-start; gap: 11px; padding: 13px 15px; border: 1px solid #d9e0d6; border-radius: 8px; color: #70251d; background: #f5f7f3; }
  .alert svg { width: 17px; height: 17px; flex: 0 0 auto; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .alert-content { display: grid; gap: 4px; min-width: 0; }
  .alert-title { font-size: 12px; font-weight: 680; }
  .alert-message { overflow-wrap: anywhere; color: #71342e; font-size: 12px; line-height: 1.5; }
  .alert-code { color: #7f5049; font-size: 10px; }
  .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 0 0 24px; }
  .page-heading h1 { margin: 0; color: #18251c; font-size: 26px; font-weight: 670; letter-spacing: -.025em; line-height: 1.2; }

  .data-badge { display: inline-flex; min-height: 25px; align-items: center; border: 1px solid #c7d9a9; border-radius: 6px; padding: 0 9px; color: #325220; background: #edf5df; font-size: 11px; white-space: nowrap; }
  .page-stack { display: grid; gap: 20px; }
  .stats-band { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .stat-item { display: grid; min-width: 0; align-content: center; gap: 5px; padding: 17px 20px 18px; }
  .stat-item + .stat-item { border-left: 1px solid var(--soft-border); }
  .stat-label { color: var(--muted); font-size: 11px; font-weight: 570; }
  .stat-value { color: #173d29; font-size: 22px; font-weight: 680; font-variant-numeric: tabular-nums; letter-spacing: -.025em; line-height: 1.2; overflow-wrap: anywhere; }
  .stat-note { color: #536055; font-size: 11px; line-height: 1.4; }
  .stat-item.is-attention .stat-value { color: var(--warning); }
  .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .panel { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 19px 20px 12px; }
  .panel-title { margin: 0; color: #19251c; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .panel-description { margin: 4px 0 0; color: #536055; font-size: 11px; line-height: 1.5; }
  .panel-content { padding: 5px 17px 16px; }
  .panel-action { flex: 0 0 auto; }
  .overview-panel-header { align-items: flex-start; }
  .overview-filter { display: grid; min-width: 150px; gap: 5px; }
  .overview-filter-label { color: var(--muted); font-size: 10px; font-weight: 600; }
  .chart-svg { display: block; width: 100%; overflow: visible; }
  .chart-svg text { fill: #536055; font-family: inherit; font-size: 11px; }
  .chart-svg .bar-count { fill: #123d2a; font-size: 11px; font-weight: 650; }
  .chart-svg .bar-track { fill: #f5f7f3; }
  .empty-chart { display: grid; min-height: 185px; place-content: center; gap: 8px; color: #536055; text-align: center; font-size: 12px; }
  .panel-heading-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .table-wrap { width: 100%; overflow-x: auto; }
  .data-table { width: 100%; min-width: 680px; border-collapse: collapse; text-align: left; }
  .data-table th { height: 37px; padding: 8px 13px; color: #536055; background: #f5f7f3; font-size: 10px; font-weight: 630; white-space: nowrap; }
  .data-table td { max-width: 280px; height: 43px; overflow: hidden; padding: 8px 13px; border-top: 1px solid #d9e0d6; color: #536055; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .data-table tbody tr:hover { background: #f5f7f3; }
  .person-link { max-width: 250px; overflow: hidden; padding: 0; border: 0; color: #174d30; background: transparent; cursor: pointer; font-size: 11px; font-weight: 640; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
  .person-link:hover { color: #255d35; text-decoration: underline; text-underline-offset: 3px; }
  .muted-value { color: #536055; }
  .empty-row { padding: 25px 15px !important; color: #536055 !important; text-align: center; white-space: normal !important; }
  .filter-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .search-field { position: relative; display: flex; min-width: 240px; flex: 1 1 290px; align-items: center; }
  .search-field svg { position: absolute; left: 11px; width: 16px; height: 16px; fill: none; stroke: #536055; stroke-width: 1.8; pointer-events: none; }
  .search-field input { width: 100%; min-height: 38px; padding: 0 12px 0 35px; border: 1px solid #d9e0d6; border-radius: 7px; color: var(--foreground); background: #fff; font-size: 12px; }
  .filter-select { min-width: 170px; min-height: 38px; padding: 0 10px; border: 1px solid #d9e0d6; border-radius: 7px; color: #536055; background: #fff; font-size: 12px; }
  .column-picker { position: relative; }
  .column-picker summary { display: flex; min-height: 38px; align-items: center; gap: 9px; padding: 0 11px; border: 1px solid #d9e0d6; border-radius: 7px; color: #536055; background: #fff; cursor: pointer; font-size: 12px; font-weight: 570; list-style: none; }
  .column-picker summary::-webkit-details-marker { display: none; }
  .column-picker summary::after { width: 6px; height: 6px; margin: -3px 1px 0 auto; border-right: 1.5px solid #536055; border-bottom: 1.5px solid #536055; content: ""; transform: rotate(45deg); }
  .column-count { display: inline-grid; min-width: 21px; height: 19px; place-items: center; border-radius: 5px; color: #26452d; background: #edf5df; font-size: 10px; }
  .column-menu { position: absolute; z-index: 15; top: calc(100% + 5px); right: 0; width: min(280px, 88vw); max-height: 330px; overflow: auto; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; box-shadow: 0 8px 24px color-mix(in srgb, #123d2a 13%, transparent); }
  .column-menu-title { margin: 4px 7px 7px; color: #46584c; font-size: 11px; font-weight: 650; }
  .column-option { display: flex; min-height: 34px; align-items: center; gap: 9px; padding: 5px 7px; border-radius: 5px; color: #536055; cursor: pointer; font-size: 11px; }
  .column-option:hover { background: #f5f7f3; }
  .column-option input { width: 15px; height: 15px; accent-color: var(--deep-green); }
  .table-summary, .pagination-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; color: var(--muted); font-size: 11px; }
  .table-summary { border-bottom: 1px solid var(--soft-border); }
  .table-summary strong { color: #123d2a; font-size: 13px; }
  .pagination-row { border-top: 1px solid var(--soft-border); }
  .pagination-controls { display: flex; align-items: center; gap: 9px; }
  .pagination-controls .button { min-height: 32px; font-size: 11px; }
  .page-count { min-width: 45px; color: #536055; font-variant-numeric: tabular-nums; text-align: center; }
  .cycle-band { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
  .cycle-block { display: grid; align-content: start; gap: 7px; padding: 20px 23px; }
  .cycle-block + .cycle-block { border-left: 1px solid var(--soft-border); }
  .cycle-name { color: var(--muted); font-size: 11px; font-weight: 610; }
  .cycle-value { color: #173d29; font-size: 24px; font-weight: 680; letter-spacing: -.025em; }
  .cycle-value small { color: var(--muted); font-size: 12px; font-weight: 520; letter-spacing: 0; }
  .cycle-note { color: #536055; font-size: 11px; line-height: 1.45; }
  .subtle-alert { border-color: #d9e0d6; color: #344835; background: #f1f6e9; }
  .subtle-alert .alert-message { color: #536055; }
  .chart-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 9px 16px; padding: 4px 8px 8px; }
  .legend-item { display: grid; min-width: 0; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 8px; color: #536055; font-size: 11px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  .legend-item strong { color: #203b2b; font-size: 11px; font-variant-numeric: tabular-nums; }
  .quality-summary { display: flex; min-height: 78px; align-items: center; gap: 13px; padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
  .quality-summary.is-attention { border-color: #d9e0d6; background: #ffffff; }
  .quality-summary svg { width: 19px; height: 19px; flex: 0 0 auto; fill: none; stroke: #123d2a; stroke-width: 1.8; }
  .quality-summary.is-attention svg { stroke: #b42318; }
  .quality-summary-copy { display: grid; flex: 1; gap: 3px; }
  .quality-summary-copy strong { color: #19251c; font-size: 13px; }
  .quality-summary-copy span { color: #536055; font-size: 11px; }
  .status-badge { min-height: 23px; padding: 3px 8px; border: 1px solid #d6ddd3; border-radius: 6px; color: #536055; background: #f7f9f6; font-size: 10px; white-space: nowrap; }
  .status-badge.is-problem { border-color: #e9d1a8; color: #b42318; background: #fffbf2; }
  .quality-list { display: grid; padding: 0 20px 8px; }
  .quality-row { display: grid; min-height: 69px; grid-template-columns: 25px minmax(180px, 1fr) 48px 90px; align-items: center; gap: 12px; border-top: 1px solid #d9e0d6; }
  .quality-icon { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 50%; }
  .quality-icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .quality-ok { color: #123d2a; background: #f5f7f3; }
  .quality-error { color: #b42318; background: #f5f7f3; }
  .quality-warning { color: #b42318; background: #f5f7f3; }
  .quality-info { color: #536055; background: #f5f7f3; }
  .quality-copy { display: grid; gap: 3px; }
  .quality-copy strong { color: #19251c; font-size: 12px; font-weight: 620; }
  .quality-copy span { color: #536055; font-size: 10px; line-height: 1.45; }
  .quality-count { color: #233b2a; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
  .quality-status { min-width: 72px; justify-self: end; padding: 4px 7px; border: 1px solid #d6ddd3; border-radius: 6px; color: #536055; background: #f7f9f6; font-size: 10px; text-align: center; }
  .quality-status.is-review { border-color: #d9e0d6; color: #b42318; background: #f5f7f3; }
  .quality-status.is-warning { border-color: #e9d1a8; color: #b42318; background: #fffbf2; }
  .quality-status.is-info { border-color: #d6ddd3; color: #536055; background: #f7f9f6; }
  .join-note { display: flex; max-width: 76ch; align-items: flex-start; gap: 10px; color: #536055; }
  .join-note svg { width: 17px; height: 17px; flex: 0 0 auto; margin-top: 2px; fill: none; stroke: #3d6545; stroke-width: 1.8; }
  .join-note p { margin: 0; font-size: 11px; line-height: 1.6; }
  .empty-state { display: grid; min-height: 300px; align-content: center; justify-items: center; gap: 12px; padding: 32px 24px; border: 1px dashed #d9e0d6; border-radius: 12px; background: #fff; text-align: center; }
  .empty-icon { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 12px; color: #123d2a; background: #f5f7f3; }
  .empty-icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .empty-state h2 { margin: 0; color: #19251c; font-size: 17px; font-weight: 650; }
  .empty-state p { max-width: 64ch; margin: 0; color: #536055; font-size: 12px; line-height: 1.6; }
  .empty-help { color: #536055; font-size: 10px; }
  .loading-state { display: grid; gap: 20px; }

  .skeleton-stat { height: 94px; }
  .skeleton-panel { height: 310px; }

  .profile-header { position: relative; padding: 24px 27px 18px; border-bottom: 1px solid #d9e0d6; }
  .profile-header h2 { margin: 13px 38px 5px 0; color: #173d29; font-size: 22px; font-weight: 680; letter-spacing: -.02em; }
  .profile-subtitle { margin: 0; color: #536055; font-size: 11px; }
  .profile-badge { display: inline-flex; align-items: center; min-height: 23px; padding: 0 8px; border: 1px solid #c7d9a9; border-radius: 6px; color: #325220; background: #edf5df; font-size: 10px; }

    function saveBlob(blob, fileName) {

        var download = document.createElement('a');

      }
      var contentBase64 = typeof data.contentBase64 === 'string' ? data.contentBase64 : data.base64;
      if (typeof contentBase64 === 'string') {
        var binary = atob(contentBase64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        saveBlob(new Blob([bytes], { type: typeof data.mimeType === 'string' ? data.mimeType : MIME }), data.name || data.fileName || 'gtgp-pessoas.xlsx');

    <script>
  window.GTGPOverviewView = (function () {
    'use strict';
    var h = function (value) { return window.GTGPRender.escape(value); };
    var fmt = function (value) { return window.GTGPRender.number(value); };

    function normalized(value) {
      return String(value == null ? '' : value)
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim().replace(/\s+/g, ' ').toLocaleUpperCase('pt-BR');
    }

    function potentialFor(person) {
      var currentPotential = window.GTGPRender.value(person, 'potencial20261');
      if (currentPotential) return currentPotential;

      var latestPotential = window.GTGPRender.value(person, 'ultimopotencial');
      if (latestPotential) return latestPotential;

      var values = person.values || {};
      var potentialKeys = Object.keys(values).filter(function (key) {
        return /^potencial\d{5}$/.test(key) && String(values[key] || '').trim();
      }).sort(function (left, right) {
        return right.localeCompare(left);
      });
      if (potentialKeys.length) return String(values[potentialKeys[0]]).trim();

      var history = window.GTGPRender.value(person, 'historicoavaliacoes');
      var match;
      var lastPotential = '';
      var pattern = /potencial\s*:\s*([^|;\n\r]+)/gi;
      while ((match = pattern.exec(history)) !== null) lastPotential = match[1].trim();
      return lastPotential;
    }

    function grouped(people, key, limit) {
      var counts = new Map();
      people.forEach(function (person) {
        var value = window.GTGPRender.value(person, key) || 'Sem preenchimento';
        counts.set(value, (counts.get(value) || 0) + 1);
      });
      var rows = Array.from(counts.entries())
        .map(function (entry) { return { label: entry[0], count: entry[1] }; })
        .sort(function (a, b) { return b.count - a.count || a.label.localeCompare(b.label, 'pt-BR'); });
      return limit === null ? rows : rows.slice(0, limit || 8);
    }

    function groupedBy(people, getValue) {
      var counts = new Map();
      people.forEach(function (person) {
        var value = getValue(person) || 'Sem preenchimento';
        counts.set(value, (counts.get(value) || 0) + 1);
      });
      return Array.from(counts.entries())
        .map(function (entry) { return { label: entry[0], count: entry[1] }; })
        .sort(function (a, b) { return b.count - a.count || a.label.localeCompare(b.label, 'pt-BR'); });
    }

    function barChart(rows, color, description, options) {
      if (!rows.length) return '<div class="empty-chart">Não há valores preenchidos para mostrar.</div>';
      var settings = options || {};
      var rowHeight = 32;
      var height = Math.max(130, rows.length * rowHeight + 12);
      var labelLimit = settings.labelLimit || 26;
      var trackX = settings.trackX || 180;
      var trackWidth = settings.trackWidth || 384;
      var maxBarWidth = trackWidth - 12;
      var chartWidth = Math.max(640, trackX + trackWidth + 76);
      var max = Math.max.apply(null, rows.map(function (row) { return row.count; }).concat([1]));
      var markup = '<svg class="chart-svg" role="img" aria-label="' + h(description) + '" viewBox="0 0 ' + chartWidth + ' ' + height + '" height="' + height + '" preserveAspectRatio="xMinYMin meet">';
      markup += '<title>' + h(description) + '</title><desc>Distribuição por categoria com contagens diretas.</desc>';
      rows.forEach(function (row, index) {
        var y = index * rowHeight + 5;
        var label = row.label.length > labelLimit ? row.label.slice(0, labelLimit - 1) + '…' : row.label;
        var barWidth = Math.max(2, Math.round((row.count / max) * maxBarWidth));
        markup += '<g><title>' + h(row.label + ': ' + fmt(row.count)) + '</title>';
        markup += '<text x="0" y="' + (y + 17) + '">' + h(label) + '</text>';
        markup += '<rect class="bar-track" x="' + trackX + '" y="' + y + '" width="' + trackWidth + '" height="21" rx="3"></rect>';
        markup += '<rect x="' + trackX + '" y="' + y + '" width="' + barWidth + '" height="21" rx="3" fill="' + color + '"></rect>';
        markup += '<text class="bar-count" x="' + Math.min(chartWidth - 30, trackX + 10 + barWidth) + '" y="' + (y + 15) + '">' + fmt(row.count) + '</text></g>';
      });
      return markup + '</svg>';
    }

    function hasField(dataset, key) {
      return (dataset.fields || []).some(function (field) { return field.key === key; });
    }

    function finalCeoLevels(dataset) {
      var levels = [];
      for (var level = 1; level <= 7; level += 1) {
        if (hasField(dataset, 'areafimceo' + level) || hasField(dataset, 'descricaoceo' + level)) {
          levels.push(level);
        }
      }
      return levels;
    }

    function finalCeoValue(person, level) {
      return window.GTGPRender.value(person, 'areafimceo' + level) ||
        window.GTGPRender.value(person, 'descricaoceo' + level);
    }

    function vpValue(person) {
      var ceo1 = finalCeoValue(person, 1);
      var ceo3 = finalCeoValue(person, 3);
      var ceo4 = finalCeoValue(person, 4);
      if (ceo1 && normalized(ceo1) !== 'SIDERURGIA') return ceo1;
      if (/\bCEO\s*[-–—]?\s*PRESIDENCY\b/.test(normalized(ceo3))) return ceo4 || ceo3;
      return ceo3 || ceo4 || ceo1;
    }

    function percentage(count, total) {
      return total ? fmt(Math.round(count * 100 / total)) + '%' : '—';
    }

    function statistic(label, value, note) {
      return '<div class="stat-item"><span class="stat-label">' + h(label) + '</span><strong class="stat-value">' + h(value) + '</strong><span class="stat-note">' + h(note) + '</span></div>';
    }

    function render(dataset, selectedCeoView) {
      var people = dataset.people || [];
      var countBase = Number(dataset.quality && dataset.quality.rowCount) || people.length;
      var total = people.length;
      var potentialCount = 0;
      var apCount = 0;
      var womenCount = 0;
      var industrialCount = 0;
      var poolRhCount = 0;

      people.forEach(function (person) {
        var potential = potentialFor(person);
        if (potential) potentialCount += 1;
        if (normalized(potential) === 'AP') apCount += 1;
        var sex = normalized(window.GTGPRender.value(person, 'sexo'));
        if (sex === 'F' || sex === 'FEMININO' || sex === 'MULHER') womenCount += 1;
        if (normalized(window.GTGPRender.value(person, 'industrialstaff')) === 'INDUSTRIAL') industrialCount += 1;
        if (normalized(window.GTGPRender.value(person, 'statustrainee')) === 'POOL RH') poolRhCount += 1;
      });

      var staffCount = Math.max(0, total - industrialCount);
      var stats = '<section class="stats-band" aria-label="Resumo da base">' +
        statistic('Ativos', fmt(countBase), 'pessoas na planilha') +
        statistic('APs', percentage(apCount, total), fmt(apCount) + ' com AP · ' + fmt(total - potentialCount) + ' sem avaliação registrada') +
        statistic('Mulheres', percentage(womenCount, total), fmt(womenCount) + ' de ' + fmt(total) + ' pessoas') +
        statistic('Industrial', percentage(industrialCount, total), 'Staff: ' + percentage(staffCount, total) + ' (' + fmt(staffCount) + ' pessoas)') +
        statistic('Pool RH', percentage(poolRhCount, total), fmt(poolRhCount) + ' de ' + fmt(total) + ' pessoas') +
      '</section>';

      if (!people.length) {
        return '<div class="page-stack">' + stats + window.GTGPRender.emptyState('A planilha não tem registros para exibir', 'A primeira aba foi importada, mas não há pessoas na resposta do backend.') + '</div>';
      }

      var ceoLevels = finalCeoLevels(dataset);
      var options = [{ value: 'vp', label: 'VP' }].concat(ceoLevels.map(function (level) {
        return { value: 'ceo-fim-' + level, label: 'CEO Fim ' + level };
      }));
      var activeView = options.some(function (option) { return option.value === selectedCeoView; }) ? selectedCeoView : 'vp';
      var selectedLevel = activeView.indexOf('ceo-fim-') === 0 ? Number(activeView.slice('ceo-fim-'.length)) : 0;
      var ceoRows = activeView === 'vp'
        ? groupedBy(people, vpValue)
        : groupedBy(people, function (person) { return finalCeoValue(person, selectedLevel); });
      var chartTitle = activeView === 'vp' ? 'Distribuição por VP' : 'Distribuição por CEO Fim ' + selectedLevel;
      var chartDescription = activeView === 'vp'
        ? 'Pessoas agrupadas por VP com base na estrutura final.'
        : 'Pessoas agrupadas por CEO Fim ' + selectedLevel + '.';
      var optionsHtml = options.map(function (option) {
        return '<option value="' + h(option.value) + '"' + (option.value === activeView ? ' selected' : '') + '>' + h(option.label) + '</option>';
      }).join('');

      var charts = '<div class="chart-grid">' +
        '<section class="panel"><header class="panel-header"><div><h2 class="panel-title">Distribuição por programa</h2><p class="panel-description">Quantidade de pessoas por programa vigente.</p></div></header><div class="panel-content">' +
          barChart(grouped(people, 'programavigente', 7), '#84bd00', 'Distribuição de pessoas por programa') +
        '</div></section>' +
        '<section class="panel"><header class="panel-header overview-panel-header"><div><h2 class="panel-title">' + h(chartTitle) + '</h2><p class="panel-description">' + h(chartDescription) + '</p></div>' +
          '<label class="overview-filter"><span class="overview-filter-label">Agrupar por</span><select id="overview-ceo-filter" class="filter-select" aria-label="Agrupar a distribuição pela estrutura final">' + optionsHtml + '</select></label></header><div class="panel-content">' +
          barChart(ceoRows, '#123d2a', chartDescription, { labelLimit: 38, trackX: 242, trackWidth: 300 }) +
        '</div></section>' +
      '</div>';

      return '<div class="page-stack">' + stats + charts + '</div>';
    }

    return { render: render, barChart: barChart, grouped: grouped };
  })();
</script>

    <script>
  window.GTGPPeopleView = (function () {
    'use strict';
    var h = function (value) { return window.GTGPRender.escape(value); };

    var ALL = '__all__';

    function optionList(values, selected, allLabel, emptyLabel) {

        html += '<option value="' + h(value) + '"' + (selected === value ? ' selected' : '') + '>' + h(value) + '</option>';
      });
      html += '<option value="' + BLANK + '"' + (selected === BLANK ? ' selected' : '') + '>' + h(emptyLabel) + '</option>';
      return html;

    function filteredPeople(dataset, state) {

      });
    }

    function rowMarkup(person, fields) {

        var value = window.GTGPRender.value(person, field.key);
        if (field.key === 'matricula' && !value) value = person.matricula || '';
        if (index === 0) {

        }

        return '<div class="page-stack">' + window.GTGPRender.emptyState('A planilha não tem pessoas para localizar', 'Quando houver registros, você poderá buscar, filtrar e abrir perfis nesta tela.') + '</div>';

      var visibleFields = selectedKeys.map(function (key) { return available.get(key); });
      var results = filteredPeople(dataset, state);
      var pages = Math.max(1, Math.ceil(results.length / state.pageSize));
      var requestedPage = Number(state.pageNumber);
      if (!Number.isFinite(requestedPage)) requestedPage = 1;
      var page = Math.min(Math.max(1, Math.floor(requestedPage)), pages);
      state.pageNumber = page;
      var shown = results.slice((page - 1) * state.pageSize, page * state.pageSize);
      var programs = Array.from(new Set(dataset.people.map(function (person) { return window.GTGPRender.value(person, 'programavigente'); }).filter(Boolean)))
        .sort(function (a, b) { return a.localeCompare(b, 'pt-BR', { numeric: true }); });

        .sort(function (a, b) { return a.localeCompare(b, 'pt-BR', { numeric: true }); });

      var filters = '<div class="filter-toolbar">' +

        '<label><span class="sr-only">Filtrar por programa</span><select class="filter-select" id="program-filter" aria-label="Filtrar por programa">' + optionList(programs, state.program, 'Todos os programas', 'Sem programa') + '</select></label>' +
        '<label><span class="sr-only">Filtrar por localidade</span><select class="filter-select" id="location-filter" aria-label="Filtrar por localidade">' + optionList(locations, state.location, 'Todas as localidades', 'Sem localidade') + '</select></label>' +
        '<details class="column-picker"' + (state.columnMenuOpen ? ' open' : '') + '><summary aria-label="Selecionar campos visíveis"><span>Colunas</span><span class="column-count">' + fmt(visibleFields.length) + '</span></summary>' +
          '<div class="column-menu"><p class="column-menu-title">Campos na tabela</p>' +

            }).join('') +
          '</div></details>' +
      '</div>';

      var headers = visibleFields.length ? visibleFields.map(function (field) { return '<th scope="col">' + h(field.label) + '</th>'; }).join('') : '<th scope="col">Campos</th>';
      var rows = visibleFields.length
        ? shown.map(function (person) { return rowMarkup(person, visibleFields); }).join('')

      if (visibleFields.length && !shown.length) {

      }
      var start = results.length ? (page - 1) * state.pageSize + 1 : 0;
      var end = Math.min(page * state.pageSize, results.length);
      var previousDisabled = page <= 1 ? ' disabled' : '';
      var nextDisabled = page >= pages ? ' disabled' : '';

      return '<div class="page-stack">' + filters +
        '<section class="panel"><div class="table-summary"><span><strong>' + fmt(results.length) + '</strong> ' + (results.length === 1 ? 'pessoa' : 'pessoas') + '</span><span>' + fmt(visibleFields.length) + ' campos visíveis · ' + fmt(fields.length) + ' disponíveis</span></div>' +

          '<button class="button button-secondary" type="button" data-action="next-page"' + nextDisabled + '>Próxima</button></div></div></section></div>';

    <script>
  window.GTGPEvaluationsView = (function () {

    var fmt = function (value) { return window.GTGPRender.number(value); };

    function countFilled(people, key) {
      return people.filter(function (person) { return window.GTGPRender.value(person, key) !== ''; }).length;
    }
    function numericValue(value) {
      var raw = String(value || '').trim();
      if (!raw) return null;
      var normalized = raw.indexOf(',') !== -1 ? raw.replace(/\./g, '').replace(',', '.') : raw;
      var parsed = Number(normalized);
      return Number.isFinite(parsed) ? parsed : null;
    }
    function grouped(people, key) {
      var counts = new Map();
      people.forEach(function (person) {

      });
      return Array.from(counts.entries()).map(function (entry) { return { label: entry[0], count: entry[1] }; })
        .sort(function (a, b) {
          var aNumber = numericValue(a.label);
          var bNumber = numericValue(b.label);

          return a.label.localeCompare(b.label, 'pt-BR', { numeric: true });

      var score2 = countFilled(people, 'nota20262');
      var potential2 = countFilled(people, 'potencial20262');
      var stage2 = countFilled(people, 'etapa20262');
      var mean = average(people, 'nota20261');
      var scoreData = grouped(people, 'nota20261').slice(0, 12);

    <script>
  window.GTGPQualityView = (function () {
    'use strict';
    var h = function (value) { return window.GTGPRender.escape(value); };
    var fmt = function (value) { return window.GTGPRender.number(value); };
    function qualityRow(label, count, kind, detail) {
      var status = count === 0 ? 'ok' : kind;
      var statusClass = status === 'error' ? 'is-review' : status === 'warning' ? 'is-warning' : status === 'info' ? 'is-info' : '';
      var statusText = count === 0 ? 'OK' : status === 'info' ? 'Informativo' : 'Revisar';
      var icon = status === 'error'
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6m0-6-6 6"></path></svg>'
        : status === 'warning'
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 20H3L12 3Z"></path><path d="M12 9v4m0 3h.01"></path></svg>'
          : status === 'info'
            ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5m0-8h.01"></path></svg>'
            : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path><circle cx="12" cy="12" r="9"></circle></svg>';
      return '<div class="quality-row"><span class="quality-icon quality-' + status + '">' + icon + '</span>' +
        '<div class="quality-copy"><strong>' + h(label) + '</strong><span>' + h(detail) + '</span></div>' +
        '<strong class="quality-count">' + fmt(count) + '</strong><span class="quality-status ' + statusClass + '">' + statusText + '</span></div>';
    }
    function render(dataset) {
      var people = dataset.people || [];
      var q = dataset.quality || {};
      var missingNotes = people.filter(function (person) { return !window.GTGPRender.value(person, 'nota20261'); }).length;
      var missingStages = people.filter(function (person) { return !window.GTGPRender.value(person, 'etapa20262'); }).length;
      var totalIssues = (Number(q.duplicateIds) || 0) + (Number(q.missingIds) || 0);
      var rowTotal = Number(q.rowCount) || 0;
      if (!rowTotal) {
        return '<div class="page-stack">' + window.GTGPRender.emptyState('Não há linhas para verificar', 'Quando a primeira aba tiver dados, as chaves e os campos sem preenchimento serão resumidos aqui.') + '</div>';
      }
      var summaryIcon = totalIssues
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 20H3L12 3Z"></path><path d="M12 9v4m0 3h.01"></path></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path><circle cx="12" cy="12" r="9"></circle></svg>';
      var summary = '<section class="quality-summary ' + (totalIssues ? 'is-attention' : '') + '">' + summaryIcon +
        '<div class="quality-summary-copy"><strong>' + (totalIssues ? 'A base precisa de revisão' : 'Sem problemas de identificação') + '</strong><span>' + fmt(q.rowCount) + ' linhas na primeira aba selecionada</span></div>' +
        '<span class="status-badge ' + (totalIssues ? 'is-problem' : '') + '">' + (totalIssues ? fmt(totalIssues) + ' itens' : 'Conferida') + '</span></section>';
      var checks = [
        qualityRow('Matrículas em branco', Number(q.missingIds) || 0, 'error', 'Linhas sem matrícula na primeira aba; continuam disponíveis para consulta.'),
        qualityRow('Matrículas duplicadas', Number(q.duplicateIds) || 0, 'error', 'Ocorrências repetidas depois da primeira na primeira aba.'),
        qualityRow('Nome em branco', Number(q.blankNames) || 0, 'warning', 'O perfil continua disponível pela matrícula, mas fica mais difícil de localizar.'),
        qualityRow('Sem nota 2026.1', missingNotes, 'info', 'Campo sem preenchimento; não é tratado como nota zero.'),
        qualityRow('Sem etapa 2026.2', missingStages, 'info', 'Campo sem preenchimento; o valor pode ser incluído quando estiver disponível.')
      ].join('');
      return '<div class="page-stack">' + summary +
        '<section class="panel"><header class="panel-header"><div><h2 class="panel-title">Verificações da base</h2><p class="panel-description">Contagens fornecidas junto com os dados do painel.</p></div></header><div class="quality-list">' + checks + '</div></section>' +
        '<div class="join-note"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg><p>O painel considera somente a primeira aba do workbook. Linhas sem matrícula ou com matrícula repetida continuam visíveis para conferência.</p></div></div>';
    }
    return { render: render };
  })();
</script>

    <script>

      return '<section class="empty-state"><span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 3h11l5 5v13H4z"></path><path d="M14 3v6h6M8 14h8m-8 4h8"></path></svg></span><h2>' + escape(title) + '</h2><p>' + escape(message) + '</p><span class="empty-help">Fonte: ' + escape(fileName + note) + '.</span></section>';
    }
    window.GTGPRender = {
      escape: escape,
      number: function (number) { return numberFormat.format(Number(number) || 0); },
      value: value,
      fold: function (text) { return String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR'); },
      emptyState: emptyState
    };

    function sourceLabel() {

    }
    function renderFeedback() {

      region.innerHTML = '<section class="alert" role="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6m0-6-6 6"></path></svg><div class="alert-content"><strong class="alert-title">Não foi possível carregar os dados</strong><span class="alert-message">' + escape(error.message || String(error)) + '</span>' + code + '<button class="button button-secondary" type="button" data-action="refresh">Tentar novamente</button></div></section>';
    }
    function restoreFocus(focus) {
      if (!focus || !focus.id) return;
      var target = document.getElementById(focus.id);
      if (!target) return;
      target.focus({ preventScroll: true });
      if (typeof focus.start === 'number' && typeof target.setSelectionRange === 'function') {
        try { target.setSelectionRange(focus.start, focus.end); } catch (ignore) {}
      }
    }
    function render() {
      var active = document.activeElement;
      var focus = active && active.id ? {
        id: active.id,

        end: typeof active.selectionEnd === 'number' ? active.selectionEnd : null
      } : null;
      var current = pageInfo[state.page] || pageInfo.overview;
      document.querySelectorAll('.nav-link[data-page]').forEach(function (button) {
        var activePage = button.getAttribute('data-page') === state.page;
        button.classList.toggle('is-active', activePage);
        if (activePage) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      document.getElementById('page-title').textContent = current.title;
      document.getElementById('page-description').textContent = current.description;
      document.getElementById('sidebar-source').textContent = state.dataset ? (state.dataset.source.simulated ? 'Dados simulados' : 'Base importada') : 'Carregando fonte…';
      var fileName = state.dataset && state.dataset.source.fileName ? state.dataset.source.fileName : 'Base GTGP.xlsx';
      document.getElementById('sidebar-file').textContent = fileName;
      document.getElementById('footer-source').textContent = fileName;
      var version = state.dataset && state.dataset.source.version ? String(state.dataset.source.version) : '';
      document.getElementById('sidebar-version').textContent = version ? 'Versão ' + version.slice(0, 12) : '';

      var sync = document.getElementById('sync-status');
      sync.textContent = state.refreshing ? 'Atualizando dados…' : state.dataset ? (state.dataset.source.simulated ? 'Amostra simulada' : 'Dados carregados') : (state.loading ? 'Carregando dados…' : 'Aguardando dados');

      else if (state.page === 'evaluations') root.innerHTML = window.GTGPEvaluationsView.render(state.dataset);
      else if (state.page === 'quality') root.innerHTML = window.GTGPQualityView.render(state.dataset);

      restoreFocus(focus);
    }
    function showToast(message, isError) {

    }
    function validateData(data) {

        error.code = 'INVALID_DASHBOARD_DATA';
        throw error;
      }
      if (typeof data.source.fileName !== 'string' || typeof data.source.sheetName !== 'string' || typeof data.source.simulated !== 'boolean') {
        var sourceError = new Error('source precisa informar fileName, sheetName e simulated conforme docs/DATA_CONTRACT.md.');
        sourceError.code = 'INVALID_DASHBOARD_SOURCE';
        throw sourceError;
      }
      var invalidField = data.fields.some(function (field) {
        return !field || typeof field.key !== 'string' || typeof field.label !== 'string' || !Array.isArray(field.source);
      });
      if (invalidField) {
        var fieldError = new Error('Cada item de fields precisa informar key, label e source conforme docs/DATA_CONTRACT.md.');
        fieldError.code = 'INVALID_DASHBOARD_FIELDS';
        throw fieldError;
      }
      var invalidPerson = data.people.some(function (person) {
        return !person || typeof person.id !== 'string' || typeof person.matricula !== 'string'
          || !person.values || typeof person.values !== 'object' || Array.isArray(person.values) || !Array.isArray(person.sources);
      });
      if (invalidPerson) {
        var peopleError = new Error('Cada item de people precisa informar id, matricula, values e sources conforme docs/DATA_CONTRACT.md.');
        peopleError.code = 'INVALID_DASHBOARD_PEOPLE';
        throw peopleError;
      }
      var qualityKeys = ['rowCount', 'duplicateIds', 'missingIds', 'blankNames'];
      var invalidQuality = qualityKeys.some(function (key) {
        return typeof data.quality[key] !== 'number' || !Number.isFinite(data.quality[key]);
      });
      if (invalidQuality) {
        var qualityError = new Error('quality precisa fornecer as quatro contagens definidas em docs/DATA_CONTRACT.md.');
        qualityError.code = 'INVALID_DASHBOARD_QUALITY';

    function load(initial) {

    function filteredPeople() { return window.GTGPPeopleView.filteredPeople(state.dataset, state); }

        ? state.dataset.fields.filter(function (field) { return state.columns.indexOf(field.key) !== -1; })
        : state.dataset.fields;

    }
    function exportXlsx() {

        .then(function () {
          showToast(numberFormat.format(payload.ids.length) + ' pessoas e ' + numberFormat.format(payload.fields.length) + ' campos foram exportados.');
        })
        .catch(function (error) {

    function openProfile(personId) {

      var fields = state.dataset.fields || [];
      var groups = ['Cadastro', 'Estrutura e trajetória', 'Formação', 'Avaliações'].map(function (name) {
        return { name: name, fields: fields.filter(function (field) { return groupFor(field) === name; }) };
      }).filter(function (group) { return group.fields.length; });

      var groupsHtml = groups.map(function (group) {
        var cells = group.fields.map(function (field) {
          var fieldValue = value(person, field.key);
          if (field.key === 'matricula' && !fieldValue) fieldValue = matricula;
          var sourceText = 'Aba ' + (field.source[0] || 'não informada');

          return '<div class="detail-field' + wide + '"><dt>' + escape(field.label) + '</dt><dd class="' + (fieldValue ? '' : 'is-missing') + '">' + escape(fieldValue || 'Sem preenchimento') + '</dd><span class="detail-source">' + escape(sourceText) + '</span></div>';
        }).join('');

        '<h2 id="profile-title">' + escape(name) + '</h2><p class="profile-subtitle">' + (matricula ? 'Matrícula ' + escape(matricula) : 'Matrícula não preenchida') + ' · dados disponíveis na primeira aba</p><div class="profile-quickfacts">' + quickfacts + '</div></header>' +
        '<div class="profile-scroll">' + groupsHtml + '</div><footer class="profile-footer"><span>' + numberFormat.format(fields.length) + ' campos disponíveis</span><span>Atualize o XLSX de origem e importe a nova versão.</span></footer></div>';
      var dialog = document.getElementById('profile-dialog');

    document.addEventListener('click', function (event) {

      if (event.target === document.getElementById('app-shell') && document.getElementById('app-shell').classList.contains('is-mobile-nav-open')) {
        document.getElementById('app-shell').classList.remove('is-mobile-nav-open');
        document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
        document.getElementById('menu-toggle').setAttribute('aria-label', 'Abrir navegação');
      }
    });
    document.addEventListener('input', function (event) {
      if (event.target && event.target.id === 'people-search') {
        state.search = event.target.value;
        state.pageNumber = 1;
        render();
      }
    });
    document.addEventListener('change', function (event) {
      if (!event.target) return;
      if (event.target.id === 'overview-ceo-filter') {
        state.overviewCeoView = event.target.value;
        render();
      } else if (event.target.id === 'program-filter') {
        state.program = event.target.value;
        state.pageNumber = 1;
        render();
      } else if (event.target.id === 'location-filter') {
        state.location = event.target.value;
        state.pageNumber = 1;
        render();
      } else if (event.target.matches('input[data-action="toggle-column"]')) {
        var key = event.target.value;
        var checked = event.target.checked;
        state.columnMenuOpen = true;
        if (checked && state.columns.indexOf(key) === -1) state.columns.push(key);
        if (!checked && state.columns.length === 1) showToast('Mantenha pelo menos um campo visível.', true);
        else if (!checked) state.columns = state.columns.filter(function (item) { return item !== key; });
        render();
      }
    });
    document.getElementById('view-root').addEventListener('toggle', function (event) {
      if (event.target && event.target.matches('.column-picker')) state.columnMenuOpen = event.target.open;
    }, true);
    document.getElementById('profile-dialog').addEventListener('click', function (event) {
      if (event.target === this) this.close();
    });
    window.GTGPAppController = { getState: function () { return state; }, refresh: function () { return load(false); } };
    render();
    load(true);
  })();
</script>

  </body>
</html>
